basePath: /api/v1
definitions:
  constants.BudgetCategory:
    enum:
    - Design
    - Material
    - Labor
    - Furniture
    - Appliance
    - Contingency
    - Other
    type: string
    x-enum-varnames:
    - BudgetCategoryDesign
    - BudgetCategoryMaterial
    - BudgetCategoryLabor
    - BudgetCategoryFurniture
    - BudgetCategoryAppliance
    - BudgetCategoryContingency
    - BudgetCategoryOther
  constants.BudgetStatus:
    enum:
    - Draft
    - Active
    - Locked
    - Archived
    type: string
    x-enum-varnames:
    - BudgetStatusDraft
    - BudgetStatusActive
    - BudgetStatusLocked
    - BudgetStatusArchived
  constants.PaymentMethod:
    enum:
    - Cash
    - BankTransfer
    - Credit
    - Company
    type: string
    x-enum-varnames:
    - PaymentMethodCash
    - PaymentMethodBankTransfer
    - PaymentMethodCredit
    - PaymentMethodCompany
  constants.RoleName:
    enum:
    - Admin
    - FinanceManager
    - ProjectManager
    - Accountant
    - Owner
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleFinanceManager
    - RoleProjectManager
    - RoleAccountant
    - RoleOwner
  constants.SupplierCategory:
    enum:
    - Material
    - Furniture
    - Appliance
    - Labor
    - Design
    - Other
    type: string
    x-enum-varnames:
    - SupplierCategoryMaterial
    - SupplierCategoryFurniture
    - SupplierCategoryAppliance
    - SupplierCategoryLabor
    - SupplierCategoryDesign
    - SupplierCategoryOther
  constants.SupplierStatus:
    enum:
    - Active
    - Suspended
    - Blacklisted
    type: string
    x-enum-varnames:
    - SupplierStatusActive
    - SupplierStatusSuspended
    - SupplierStatusBlacklisted
  dto.AdjustBudgetRequest:
    properties:
      reason:
        type: string
      total_amount:
        type: number
    required:
    - reason
    - total_amount
    type: object
  dto.ApproveExpenseRequest:
    properties:
      approval_comment:
        maxLength: 512
        type: string
    type: object
  dto.CreateBudgetRequest:
    properties:
      name:
        maxLength: 128
        type: string
      project_id:
        type: string
      status:
        $ref: '#/definitions/constants.BudgetStatus'
      total_amount:
        type: number
    required:
    - name
    - project_id
    - total_amount
    type: object
  dto.CreateExpenseRequest:
    properties:
      amount:
        type: number
      attachment_url:
        maxLength: 512
        type: string
      budget_item_id:
        type: integer
      description:
        maxLength: 512
        type: string
      expense_date:
        type: string
      invoice_no:
        maxLength: 128
        type: string
      payment_method:
        $ref: '#/definitions/constants.PaymentMethod'
      supplier_id:
        type: integer
    required:
    - amount
    - budget_item_id
    - expense_date
    - payment_method
    type: object
  dto.CreateItemRequest:
    properties:
      budget_amount:
        type: number
      category:
        $ref: '#/definitions/constants.BudgetCategory'
      remark:
        maxLength: 512
        type: string
      sort_order:
        minimum: 0
        type: integer
      sub_category:
        maxLength: 128
        type: string
    required:
    - budget_amount
    - category
    type: object
  dto.CreateReconciliationRequest:
    properties:
      paid_amount:
        minimum: 0
        type: number
      payable_amount:
        type: number
      period:
        type: string
      project_id:
        type: string
      supplier_id:
        type: integer
    required:
    - payable_amount
    - period
    - project_id
    - supplier_id
    type: object
  dto.CreateSupplierRequest:
    properties:
      address:
        maxLength: 255
        type: string
      bank_account:
        maxLength: 128
        type: string
      bank_name:
        maxLength: 128
        type: string
      category:
        $ref: '#/definitions/constants.SupplierCategory'
      contact:
        maxLength: 64
        type: string
      name:
        maxLength: 128
        type: string
      phone:
        maxLength: 32
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      status:
        $ref: '#/definitions/constants.SupplierStatus'
    required:
    - category
    - name
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      expires_in:
        type: integer
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserInfo'
    type: object
  dto.PayExpenseRequest:
    properties:
      payment_date:
        type: string
    type: object
  dto.RejectExpenseRequest:
    properties:
      approval_comment:
        maxLength: 512
        type: string
    required:
    - approval_comment
    type: object
  dto.UpdateBudgetRequest:
    properties:
      name:
        maxLength: 128
        type: string
      status:
        $ref: '#/definitions/constants.BudgetStatus'
      total_amount:
        minimum: 0
        type: number
    type: object
  dto.UpdateItemRequest:
    properties:
      budget_amount:
        type: number
      category:
        $ref: '#/definitions/constants.BudgetCategory'
      remark:
        maxLength: 512
        type: string
      sort_order:
        minimum: 0
        type: integer
      sub_category:
        maxLength: 128
        type: string
    type: object
  dto.UpdateReconciliationRequest:
    properties:
      paid_amount:
        minimum: 0
        type: number
      payable_amount:
        type: number
    type: object
  dto.UpdateSupplierRequest:
    properties:
      address:
        maxLength: 255
        type: string
      bank_account:
        maxLength: 128
        type: string
      bank_name:
        maxLength: 128
        type: string
      category:
        $ref: '#/definitions/constants.SupplierCategory'
      contact:
        maxLength: 64
        type: string
      name:
        maxLength: 128
        type: string
      phone:
        maxLength: 32
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
      status:
        $ref: '#/definitions/constants.SupplierStatus'
    type: object
  dto.UserInfo:
    properties:
      display_name:
        type: string
      id:
        type: integer
      role:
        $ref: '#/definitions/constants.RoleName'
      username:
        type: string
    type: object
  response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:19306
